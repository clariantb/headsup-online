# Production stack: game server + LiveKit + Caddy (automatic HTTPS), all on one domain.
#   cp .env.production.example .env   # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      LIVEKIT_URL: wss://${DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Media goes straight to LiveKit, not through Caddy. Open these on the firewall.
      - "7881:7881/tcp"
      - "7882:7882/udp"

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on: [app, livekit]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
